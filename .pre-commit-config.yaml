# Hooks run in the repo environment (language: system), so `uv run` resolves
# against .venv. Install once with: uv run pre-commit install
#
# Path notes: SPECS 4.2/4.5 say `src tests`, which do not exist until the
# hexagonal refactor (M2). Until then the hooks target what is actually here.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ty
        name: ty
        entry: uv run ty check .
        language: system
        pass_filenames: false
        always_run: true
      - id: vulture
        name: vulture
        entry: uv run vulture gpx_animate.py tests --min-confidence 80
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        # No coverage here: the suite is fast, but the >= 90% floor is CI's job
        # (see the Tests step in .github/workflows/ci.yml).
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
