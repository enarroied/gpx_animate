[project]
name = "gpx-animate"
version = "0.0.0"
description = "Turn a GPX file into a short animated MP4 (and GIF) of a track."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "contextily>=1.7.1",
    "gpxpy>=1.6.2",
    "matplotlib>=3.11.2",
    "numpy>=2.0.0",
    "pyproj>=3.7.2",
]

# The project is installable as of M2: there is finally a package to install,
# which is what makes `uvx gpx-animate` and the console script work.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
gpx-animate = "gpx_animate.adapters.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gpx_animate"]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "ty>=0.0.84",
    "vulture>=2.16",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]
# ruff 0.16 also formats Python blocks inside Markdown. SPECS.md is a
# hand-authored design doc under active review, so keep the linter off it.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "PTH", "B", "C4", "SIM", "RET", "PL", "N"]
# PLR0913 and PLR0917 are both argument-count rules; SPECS 4.2 only listed the
# former. E501 (line length) stays off because `ruff format` owns line breaks.
ignore = ["E501", "PLR0913", "PLR0917", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
# The matplotlib renderer follows the geo/plot conventions (X, Y for projected
# coordinates) that N806 dislikes. The old monolith exemption is gone with the
# monolith; this is its replacement.
"src/gpx_animate/adapters/renderers/matplotlib_renderer.py" = ["N806"]

[tool.ruff.lint.isort]
force-single-line = true
combine-as-imports = true
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# No pythonpath entry for the package any more: it is installed by `uv sync`
# now that it has a [build-system], so imports resolve the normal way. The
# tests directory itself is on the path so the shared fakes in tests/fakes.py
# are importable from any depth without __init__.py files in the tree.
pythonpath = ["tests"]
# The integration tests need ffmpeg and the tile servers; opt in with
# `pytest -m integration`. CI runs them as a non-blocking step instead.
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: needs ffmpeg on PATH and network access to tile servers",
]

[tool.coverage.run]
source = ["gpx_animate"]
branch = true

[tool.coverage.report]
show_missing = true
# SPECS US-3 asks for >= 85% on domain/ and application/ with no target on
# adapters. Adapters are covered anyway — mocking contextily and ffmpeg is
# cheap, and an uncovered adapter is where the bugs hide. Revisit when M4 adds
# rasterio-backed basemaps, which may be harder to exercise.
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
