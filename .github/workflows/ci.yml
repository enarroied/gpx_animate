name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Type check
        # SPECS 4.3 says `ty check src tests`; those paths arrive at M2.
        run: uv run ty check .

      - name: Dead code
        run: uv run vulture gpx_animate.py tests --min-confidence 80

      - name: Tests
        run: uv run pytest -q --cov --cov-report=xml

      - name: Integration tests
        # Needs tile servers, so a flaky provider must not turn the build red.
        continue-on-error: true
        run: uv run pytest -q -m integration

      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          # Public repos need no token; set CODECOV_TOKEN if this is private.
          fail_ci_if_error: false
