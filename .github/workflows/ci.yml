name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # --extra gui because the GUI tests need PyQt6, which is deliberately not
        # a base dependency. The lock file is unchanged by an extra, so
        # --locked still holds.
        run: uv sync --locked --extra gui

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check src tests

      - name: Dead code
        run: uv run vulture src tests --min-confidence 80

      - name: Tests
        run: uv run pytest -q --cov --cov-report=xml

      - name: Integration tests
        # Needs tile servers, so a flaky provider must not turn the build red.
        continue-on-error: true
        run: uv run pytest -q -m integration

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          # CodeCov rejects tokenless uploads, so the secret is needed even
          # though this repo is public. fail_ci_if_error is deliberate: a
          # silently-dropped upload leaves the badge stale with nothing to say so.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
