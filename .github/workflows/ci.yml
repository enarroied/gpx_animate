name: ci

on:
  push:
    branches: [master]
  pull_request:
  # Also lets the Windows build be kicked off by hand (and by v* tags).
  workflow_dispatch:

jobs:
  check:
    # Dispatch runs exist to produce the Windows artifact; they must not also
    # re-pay for the full matrix.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt runtime libraries
        # PyQt6's QtGui links libEGL/libGL even when the offscreen QPA
        # platform is used, and the ubuntu-latest image ships without them.
        # The gui extra installs PyQt6 in this job, so the headless
        # pytest-qt suite needs these system libraries present.
        # The runner's apt/network has intermittently stalled hard (17 min
        # hangs observed); ForceIPv4 avoids the IPv6 mirror stall, bounded
        # retries make a stall degrade instead, and `|| true` lets the install
        # go ahead from whatever lists are already present.
        run: |
          for i in 1 2 3; do
            timeout 80 sudo apt-get update -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=20 && break
            sleep 5
          done
          sudo apt-get install -y -o Acquire::http::Timeout=20 libegl1 libgl1 libxkbcommon0

      - name: Install dependencies
        # --extra gui because the GUI tests need PyQt6, which is deliberately not
        # a base dependency. The lock file is unchanged by an extra, so
        # --locked still holds.
        run: uv sync --locked --extra gui

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check src tests

      - name: Dead code
        run: uv run vulture src tests --min-confidence 80

      - name: Tests
        run: uv run pytest -q --cov --cov-report=xml

      - name: Integration tests
        # Needs tile servers, so a flaky provider must not turn the build red.
        continue-on-error: true
        run: uv run pytest -q -m integration

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          # CodeCov rejects tokenless uploads, so the secret is needed even
          # though this repo is public. fail_ci_if_error is false on purpose:
          # the upload has been flaky without anything test-related wrong, and
          # an occasional missed upload must not turn the matrix red. The
          # badge may therefore lag; the --cov run below still enforces the
          # coverage floor locally.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # PyInstaller cannot cross-compile, so the Windows artifact is produced on a
  # Windows runner. Triggered manually or by a v* tag; normal pushes and PRs do
  # not pay for it. The Linux equivalent is verified locally (see AGENTS).
  build-windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --extra gui

      - name: Download a static ffmpeg for the portable folder
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
        # find_ffmpeg() prefers a binary beside the program over PATH, so the
        # release folder carries its own ffmpeg.exe — the portable-folder model.

      - name: Build the frozen binaries
        run: uv run pyinstaller packaging/gpx-animate.spec --noconfirm

      - name: Bundle ffmpeg beside the executables
        shell: pwsh
        run: |
          $ffmpeg = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ffmpeg.FullName dist\ffmpeg.exe
        # Both dist\gpx-animate-gui.exe and dist\gpx-animate.exe find it.

      - name: Render smoke test under freeze (real Windows, offline)
        # The GUI cannot be driven head-first here, so the console binary runs
        # the identical frozen render path: ffmpeg-beside-the-exe, H.264 output.
        shell: pwsh
        run: |
          $gpx = Get-ChildItem data -Filter *.gpx | Select-Object -First 1
          & dist\gpx-animate.exe $gpx.FullName --style none --duration 0.2 --fps 5 --hold 0 --out $env:RUNNER_TEMP\smoke.mp4
          if (-not (Test-Path $env:RUNNER_TEMP\smoke.mp4)) { throw "no smoke.mp4 produced" }

      - name: Collect the portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path portable
          Copy-Item dist\gpx-animate-gui.exe portable\
          Copy-Item dist\ffmpeg.exe portable\
          Compress-Archive -Path portable\* -DestinationPath gpx-animate-gui-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: gpx-animate-gui-windows
          path: gpx-animate-gui-windows.zip

      - name: Attach to the release (tagged runs only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: gpx-animate-gui-windows.zip
